<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B 站视频测试</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 {
      color: #fb7299;
      margin-bottom: 1rem;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      margin: 2rem 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #fff5f7;
      border-left: 4px solid #fb7299;
      border-radius: 4px;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #fb7299;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 B 站视频嵌入测试</h1>
    <p>这是一个测试页面，用于验证 B 站视频是否可以正常嵌入。</p>
    
    <div class="video-container">
      <iframe 
        src="https://player.bilibili.com/player.html?bvid=BV1xx411c7mD&page=1&high_quality=1" 
        scrolling="no" 
        border="0" 
        frameborder="0" 
        framespacing="0" 
        allowfullscreen="true"
        sandbox="allow-same-origin allow-scripts allow-presentation allow-forms">
      </iframe>
    </div>
    
    <div class="info">
      <h3>✅ 如果视频可以播放：</h3>
      <p>说明 B 站视频嵌入正常工作！你可以在其他页面中使用相同的方式嵌入视频。</p>
      
      <h3 style="margin-top: 1rem;">❌ 如果视频无法播放：</h3>
      <p>请检查：</p>
      <ul>
        <li>网络连接是否正常</li>
        <li>浏览器是否允许加载第三方 iframe</li>
        <li>B 站视频 BV 号是否正确</li>
      </ul>
    </div>
    
    <a href="/vibe/" class="back-link">← 返回创作列表</a>
  </div>
</body>
</html>
