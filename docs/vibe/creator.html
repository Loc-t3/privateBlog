<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创意网页作品</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    
    .description {
      color: #666;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    
    .demo-area {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 2rem;
      margin: 2rem 0;
      min-height: 300px;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 创意网页作品</h1>
    <p class="description">这是一个 Vibe Coding 创意网页作品展示页面。</p>
    
    <div class="demo-area">
      <!-- 在这里放置你的创意网页内容 -->
      <p>在此处展示你的创意交互内容...</p>
    </div>
    
    <a href="/vibe/" class="back-link">← 返回创作列表</a>
  </div>
</body>
</html>
